# Начальная версия сайта Книги рода на порту 80 (до выдачи сертификата). certbot сам добавит https и перенаправление.
server {
    listen 80;
    listen [::]:80;
    server_name kniga-balanuca.ru www.kniga-balanuca.ru;

    root /var/www/kniga/site;
    index index.html;
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /push-sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
